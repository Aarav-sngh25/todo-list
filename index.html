<!DOCTYPE html>
<html>
  <head>
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p>Todo List</p>
    <div class="todo-input-grid">
      <input class="js-name-input name-input" placeholder="Todo name" onkeydown="enterButton(event)">

      <input type="date"
        class="js-due-date-input date-input" onkeydown="enterButton(event)">

      <button class="add-button" onclick="
        addTodo();
    ">Add</button>
    </div>

    <div class="js-todo-list todo-grid"></div>
   <script src="script.js"></script>
  </body>
</html>
